<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0714">
  <link rel="manifest" href="manifest.json">
  <title>App Forge • VRM 3D Loft Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.5/lib/three-vrm.module.min.js"
      }
    }
  </script>
  <style>
    .glass-card { background: rgba(18, 11, 28, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(244, 63, 94, 0.25); }
  </style>
</head>
<body class="bg-[#0d0714] text-amber-50 min-h-screen p-3.5 font-sans">
  <div class="max-w-lg mx-auto space-y-3 pb-12">

    <!-- 3D VRM Loft Viewport -->
    <div class="relative rounded-3xl overflow-hidden border border-rose-500/35 shadow-2xl bg-[#140b20]">
      <div class="absolute top-3 left-3 right-3 z-10 flex items-center justify-between">
        <label class="cursor-pointer bg-black/65 hover:bg-black/80 backdrop-blur-md px-3 py-1 rounded-full border border-rose-400/40 text-[10px] font-black uppercase tracking-wider text-rose-200">
          📂 Load .VRM Avatar
          <input id="vrmFileInput" type="file" accept=".vrm,.glb" class="hidden">
        </label>
        <div id="buildBadge" class="px-3 py-1 rounded-full text-[11px] font-bold bg-black/65 backdrop-blur-md border border-amber-400/35 text-amber-200">Idle</div>
      </div>

      <!-- Empty VRM Drop Prompt Overlay (Hides once VRM loads) -->
      <div id="vrmPromptOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/45 pointer-events-none z-0 px-6 text-center">
        <div class="text-xs font-black text-rose-300 uppercase tracking-widest">No .VRM Avatar Loaded</div>
        <div class="text-[11px] text-amber-100/80 mt-1">Tap <b>📂 Load .VRM Avatar</b> above to select any downloaded VRM model (cached offline in IndexedDB), or upload <code>mj.vrm</code> to this repo.</div>
      </div>

      <div id="stage3d" class="w-full h-64 relative"></div>

      <div id="mjSpeech" class="px-4 py-2 bg-black/75 border-t border-rose-500/25 text-[11px] text-amber-200 flex items-center justify-between">
        <span>💬 "Ready when you are — load a .VRM model or deploy code below."</span>
        <span id="repoCounterPill" class="text-[10px] font-bold text-emerald-400"></span>
      </div>
    </div>

    <!-- 1. GitHub Token -->
    <div class="glass-card rounded-2xl p-3.5 space-y-2">
      <div class="flex justify-between items-center">
        <span class="text-[10px] font-black uppercase tracking-widest text-amber-300">1. GitHub API Token</span>
        <button id="toggleTokenBtn" type="button" class="text-[11px] text-rose-300/70 underline">Show / Edit</button>
      </div>
      <div id="tokenWrap" class="flex gap-2">
        <input id="ghToken" type="password" placeholder="Paste github_pat_... token" class="flex-1 bg-black/60 border border-rose-500/30 rounded-xl px-3 py-2 text-xs text-white outline-none">
        <button id="saveTokenBtn" type="button" class="px-4 py-2 bg-gradient-to-r from-rose-500 to-amber-500 text-slate-950 font-black rounded-xl text-xs">Connect</button>
      </div>
    </div>

    <!-- 2. Repo & File Selector -->
    <div class="glass-card rounded-2xl p-3.5 space-y-2.5">
      <div class="text-[10px] font-black uppercase tracking-widest text-rose-300">2. Select App Repo & File</div>
      <div class="grid grid-cols-2 gap-2">
        <select id="repoSelect" class="bg-black/60 border border-rose-500/30 rounded-xl px-2.5 py-2 text-xs text-white outline-none"></select>
        <select id="fileSelect" class="bg-black/60 border border-rose-500/30 rounded-xl px-2.5 py-2 text-xs text-white outline-none"></select>
      </div>
      <div class="flex gap-2">
        <input id="newFileName" type="text" placeholder="Or new filename (e.g. patch-fix.js)" class="flex-1 bg-black/60 border border-rose-500/30 rounded-xl px-3 py-1.5 text-xs text-white outline-none">
        <button id="createFileModeBtn" type="button" class="px-3.5 py-1.5 bg-rose-500/20 border border-rose-500/40 text-rose-200 font-bold rounded-xl text-xs">+ New</button>
      </div>
    </div>

    <!-- 3. Code Editor & Deploy -->
    <div class="glass-card rounded-2xl p-3.5 space-y-2.5">
      <div class="flex items-center justify-between">
        <span id="activePathLabel" class="text-xs font-mono font-bold text-emerald-300 truncate">No file loaded</span>
        <div class="flex gap-1.5 shrink-0">
          <button id="pasteReplaceBtn" type="button" class="px-2.5 py-1.5 bg-amber-400 text-slate-950 font-black rounded-xl text-[11px]">📋 Paste All</button>
          <button id="copyCurrentBtn" type="button" class="px-2.5 py-1.5 bg-black/60 border border-rose-500/30 text-rose-200 font-bold rounded-xl text-[11px]">Copy</button>
        </div>
      </div>
      <textarea id="codeEditor" rows="12" spellcheck="false" placeholder="Type or paste code here..." class="w-full bg-[#07040b] border border-rose-500/25 rounded-xl p-3 text-[11px] text-amber-100 font-mono leading-relaxed outline-none"></textarea>
      <div class="flex gap-2">
        <input id="commitMsg" type="text" value="VRM Loft Studio deploy" class="flex-1 bg-black/60 border border-rose-500/30 rounded-xl px-3 py-2 text-xs text-white outline-none">
        <button id="deployBtn" type="button" class="px-5 py-2.5 bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 text-white font-black rounded-xl text-xs shrink-0 shadow-lg">🚀 Deploy Now</button>
      </div>
      <a id="liveSiteLink" href="#" target="_blank" class="hidden block text-center py-2 bg-black/60 border border-emerald-500/40 rounded-xl text-xs font-bold text-emerald-300">↗ Open Live App</a>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    const TOKEN_KEY = "app_forge_gh_token_v1";
    let ghUser = "", currentSha = null, isNewFile = false, typingTimer = null, mjMode = "idle", currentVrm = null;
    const $ = id => document.getElementById(id);
    const getHeaders = () => ({ "Authorization": `Bearer ${localStorage.getItem(TOKEN_KEY) || ""}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" });

    // --- IndexedDB Storage for Offline VRM Binary ---
    function saveVrmBuffer(buf) {
      return new Promise(res => {
        const req = indexedDB.open("AppForgeVrmDB", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("avatars");
        req.onsuccess = () => { const tx = req.result.transaction("avatars", "readwrite"); tx.objectStore("avatars").put(buf, "mj_avatar"); tx.oncomplete = res; };
      });
    }
    function loadVrmBuffer() {
      return new Promise(res => {
        const req = indexedDB.open("AppForgeVrmDB", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("avatars");
        req.onsuccess = () => { const g = req.result.transaction("avatars", "readonly").objectStore("avatars").get("mj_avatar"); g.onsuccess = () => res(g.result || null); g.onerror = () => res(null); };
      });
    }

    // --- Three.js + @pixiv/three-vrm Engine ---
    const box = $("stage3d");
    const w = box.clientWidth || 400, h = box.clientHeight || 256;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x140b20);
    scene.fog = new THREE.FogExp2(0x140b20, 0.06);

    const cam = new THREE.PerspectiveCamera(34, w / h, 0.1, 50);
    cam.position.set(0.25, 1.32, 2.35);
    cam.lookAt(-0.08, 1.05, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    box.appendChild(renderer.domElement);

    // Studio Lighting (Key, Warm Loft Lamp, Cyan CRT Rim)
    scene.add(new THREE.AmbientLight(0xffedd5, 0.75));
    const keyLight = new THREE.DirectionalLight(0xfff1f2, 1.35);
    keyLight.position.set(1.5, 2.5, 2.2);
    scene.add(keyLight);
    const crtLight = new THREE.PointLight(0x38bdf8, 1.6, 4);
    crtLight.position.set(-0.75, 1.15, 0.45);
    scene.add(crtLight);

    // Loft Desk & Glowing Monitor
    const matWood = new THREE.MeshStandardMaterial({ color: 0x4a2918, roughness: 0.55 });
    const desk = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.85), matWood);
    desk.position.set(-0.82, 0.72, 0.25); scene.add(desk);
    const monitor = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.42, 0.24), new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.3 }));
    monitor.position.set(-0.92, 0.98, 0.18); monitor.rotation.y = 0.45; scene.add(monitor);
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.44, 0.34), new THREE.MeshBasicMaterial({ color: 0x0ea5e9 }));
    screen.position.set(-0.85, 0.98, 0.29); screen.rotation.y = 0.45; scene.add(screen);

    const loader = new GLTFLoader();
    loader.register(parser => new VRMLoaderPlugin(parser));

    async function mountVrmFromUrlOrBuffer(source) {
      const url = source instanceof ArrayBuffer ? URL.createObjectURL(new Blob([source])) : source;
      loader.load(url, gltf => {
        const vrm = gltf.userData.vrm;
        if (!vrm) return;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);
        if (currentVrm) scene.remove(currentVrm.scene);
        currentVrm = vrm;
        vrm.scene.rotation.y = Math.PI; // VRM 0.x faces -Z; rotate to camera
        vrm.scene.position.set(0.05, 0, 0.15);
        scene.add(vrm.scene);
        $("vrmPromptOverlay").classList.add("hidden");
        setMjState("idle", "3D VRM Avatar online — ready to deploy!");
      });
    }

    // Auto-load from IndexedDB or repo mj.vrm
    loadVrmBuffer().then(buf => {
      if (buf) mountVrmFromUrlOrBuffer(buf);
      else fetch("mj.vrm").then(r => { if (r.ok) mountVrmFromUrlOrBuffer("mj.vrm"); }).catch(() => {});
    });

    $("vrmFileInput").onchange = async e => {
      const file = e.target.files?.[0];
      if (!file) return;
      const buf = await file.arrayBuffer();
      await saveVrmBuffer(buf);
      mountVrmFromUrlOrBuffer(buf);
    };

    // Procedural Humanoid Bone Animation Loop (Idle, Blink, Typing at Desk)
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const t = clock.elapsedTime;

      if (currentVrm) {
        const h = currentVrm.humanoid;
        const exp = currentVrm.expressionManager;

        // Auto Eye Blink every ~3.5s
        if (exp) {
          const blinkCycle = t % 3.6;
          exp.setValue("blink", blinkCycle > 3.45 ? Math.sin(((blinkCycle - 3.45) / 0.15) * Math.PI) : 0);
          exp.setValue("happy", mjMode === "idle" ? 0.35 : 0.15);
        }

        // Seated Pose + Typing IK Approximation
        const lUpperLeg = h.getNormalizedBoneNode("leftUpperLeg");
        const rUpperLeg = h.getNormalizedBoneNode("rightUpperLeg");
        const lLowerLeg = h.getNormalizedBoneNode("leftLowerLeg");
        const rLowerLeg = h.getNormalizedBoneNode("rightLowerLeg");
        if (lUpperLeg && rUpperLeg) { lUpperLeg.rotation.x = 1.35; rUpperLeg.rotation.x = 1.35; }
        if (lLowerLeg && rLowerLeg) { lLowerLeg.rotation.x = -1.35; rLowerLeg.rotation.x = -1.35; }
        currentVrm.scene.position.y = -0.38;

        const spine = h.getNormalizedBoneNode("spine");
        const head = h.getNormalizedBoneNode("head");
        const lArm = h.getNormalizedBoneNode("leftUpperArm");
        const rArm = h.getNormalizedBoneNode("rightUpperArm");
        const lFore = h.getNormalizedBoneNode("leftLowerArm");
        const rFore = h.getNormalizedBoneNode("rightLowerArm");

        if (mjMode === "typing") {
          currentVrm.scene.rotation.y = THREE.MathUtils.lerp(currentVrm.scene.rotation.y, Math.PI + 0.72, 0.1);
          if (spine) spine.rotation.x = 0.12 + Math.sin(t * 12) * 0.015;
          if (head) head.rotation.y = THREE.MathUtils.lerp(head.rotation.y, 0.18, 0.1);
          if (lArm && rArm) { lArm.rotation.set(0.55, 0, -0.35); rArm.rotation.set(0.55, 0, 0.35); }
          if (lFore && rFore) {
            lFore.rotation.x = 0.75 + Math.sin(t * 26) * 0.12;
            rFore.rotation.x = 0.75 + Math.cos(t * 26) * 0.12;
          }
          screen.material.color.setHex(Math.sin(t * 16) > 0 ? 0x38bdf8 : 0x34d399);
        } else {
          currentVrm.scene.rotation.y = THREE.MathUtils.lerp(currentVrm.scene.rotation.y, Math.PI - 0.18, 0.06);
          if (spine) spine.rotation.x = Math.sin(t * 2) * 0.025;
          if (head) head.rotation.y = Math.sin(t * 1.1) * 0.08;
          if (lArm && rArm) { lArm.rotation.set(0.15, 0, -1.15); rArm.rotation.set(0.15, 0, 1.15); }
          if (lFore && rFore) { lFore.rotation.x = 0.25; rFore.rotation.x = 0.25; }
          screen.material.color.setHex(0x0284c7);
        }
        currentVrm.update(dt);
      }
      renderer.render(scene, cam);
    }
    animate();

    function setMjState(mode, speechText) {
      mjMode = mode;
      if (speechText) $("mjSpeech").firstElementChild.textContent = `💬 "${speechText}"`;
    }

    function setBadge(text, tone = "idle") {
      const b = $("buildBadge"); b.textContent = text;
      b.className = tone === "ok"
        ? "px-3 py-1 rounded-full text-[11px] font-bold bg-emerald-500/25 border border-emerald-400 text-emerald-200"
        : tone === "busy"
        ? "px-3 py-1 rounded-full text-[11px] font-bold bg-amber-500/25 border border-amber-400 text-amber-200"
        : "px-3 py-1 rounded-full text-[11px] font-bold bg-black/65 border border-amber-400/35 text-amber-200";
    }

    async function initConnection() {
      const tok = localStorage.getItem(TOKEN_KEY); if (!tok) return;
      $("ghToken").value = tok; $("tokenWrap").classList.add("hidden"); setBadge("Connecting...", "busy");
      const uRes = await fetch("https://api.github.com/user", { headers: getHeaders() });
      if (!uRes.ok) { setBadge("Token Error"); $("tokenWrap").classList.remove("hidden"); return; }
      const u = await uRes.json(); ghUser = u.login;
      const rRes = await fetch("https://api.github.com/user/repos?per_page=100&sort=updated", { headers: getHeaders() });
      const repos = await rRes.json();
      $("repoSelect").innerHTML = repos.map(r => `<option value="${r.name}">${r.name}</option>`).join("");
      $("repoCounterPill").textContent = `${repos.length} Repos`;
      if (repos.some(r => r.name === "Skill-Tree")) $("repoSelect").value = "Skill-Tree";
      setBadge(`Connected: ${ghUser}`, "ok"); await loadRepoFiles();
    }

    async function loadRepoFiles() {
      const repo = $("repoSelect").value; if (!repo || !ghUser) return;
      const link = $("liveSiteLink"); link.href = `https://${ghUser.toLowerCase()}.github.io/${repo}/`; link.textContent = `↗ Open Live ${repo}`; link.classList.remove("hidden");
      const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/contents/`, { headers: getHeaders() });
      const items = await res.json();
      const files = Array.isArray(items) ? items.filter(x => x.type === "file") : [];
      $("fileSelect").innerHTML = files.map(f => `<option value="${f.path}">${f.path}</option>`).join("");
      if (files.length) await loadFileContent(files[0].path);
    }

    async function loadFileContent(path) {
      const repo = $("repoSelect").value; isNewFile = false; $("activePathLabel").textContent = `${repo}/${path}`; setBadge("Loading...", "busy");
      const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/contents/${path}`, { headers: getHeaders() });
      const data = await res.json(); currentSha = data.sha;
      const bytes = Uint8Array.from(atob(data.content.replace(/\n/g, "")), c => c.charCodeAt(0));
      $("codeEditor").value = new TextDecoder().decode(bytes); setBadge("Ready", "ok");
    }

    async function deployFile() {
      const repo = $("repoSelect").value, path = isNewFile ? $("newFileName").value.trim() : $("fileSelect").value;
      if (!repo || !path) return alert("Select or name a file first.");
      const encoded = btoa(String.fromCharCode(...new TextEncoder().encode($("codeEditor").value)));
      setBadge("Deploying...", "busy");
      setMjState("typing", `Turning to terminal and deploying ${path}...`);
      const body = { message: $("commitMsg").value.trim() || `Update ${path}`, content: encoded };
      if (!isNewFile && currentSha) body.sha = currentSha;
      const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/contents/${path}`, { method: "PUT", headers: getHeaders(), body: JSON.stringify(body) });
      if (!res.ok) { const err = await res.json(); setBadge("Deploy Failed"); setMjState("idle", "Commit failed — check alert."); return alert("GitHub API Error: " + (err.message || res.status)); }
      const out = await res.json(); currentSha = out.content.sha; isNewFile = false; $("activePathLabel").textContent = `${repo}/${path}`;
      setBadge("Building Pages...", "busy");
      pollPagesStatus(repo);
    }

    async function pollPagesStatus(repo) {
      for (let i = 0; i < 18; i++) {
        await new Promise(r => setTimeout(r, 4000));
        try {
          const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/pages/builds/latest`, { headers: getHeaders() });
          if (res.ok) {
            const b = await res.json();
            if (b.status === "built") { setBadge("🟢 Live on Pages!", "ok"); setMjState("idle", `${repo} is live on GitHub Pages!`); return; }
            if (b.status === "errored") { setBadge("🔴 Build Error"); setMjState("idle", "GitHub Pages build error."); return; }
          }
        } catch {}
      }
      setBadge("🟢 Pushed to Main", "ok");
      setMjState("idle", "Pushed to main!");
    }

    $("codeEditor").addEventListener("input", () => {
      setMjState("typing", "Typing edits into terminal...");
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => setMjState("idle", "Ready — hit Deploy Now!"), 1800);
    });
    $("saveTokenBtn").onclick = () => { const val = $("ghToken").value.trim(); if (!val) return; localStorage.setItem(TOKEN_KEY, val); initConnection(); };
    $("toggleTokenBtn").onclick = () => $("tokenWrap").classList.toggle("hidden");
    $("repoSelect").onchange = loadRepoFiles;
    $("fileSelect").onchange = () => loadFileContent($("fileSelect").value);
    $("createFileModeBtn").onclick = () => { const fn = $("newFileName").value.trim(); if (!fn) return alert("Type filename first"); isNewFile = true; currentSha = null; $("activePathLabel").textContent = `${$("repoSelect").value}/${fn} (NEW)`; $("codeEditor").value = ""; };
    $("pasteReplaceBtn").onclick = async () => { try { const clip = await navigator.clipboard.readText(); if (clip) { $("codeEditor").value = clip; setMjState("typing", "Clipboard loaded!"); } } catch {} };
    $("copyCurrentBtn").onclick = async () => { await navigator.clipboard.writeText($("codeEditor").value); setBadge("Copied!", "ok"); };
    $("deployBtn").onclick = deployFile;
    initConnection();
  </script>
</body>
</html>
