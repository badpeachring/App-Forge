<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09040f">
  <link rel="manifest" href="manifest.json">
  <title>App Forge • Anime Loft Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes softPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes floatGentle { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    .anime-card { background: rgba(18, 10, 28, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(244, 63, 94, 0.2); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
    .glow-text { text-shadow: 0 0 12px rgba(244, 63, 94, 0.4); }
    .floating-art { animation: floatGentle 4s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#09040f] text-pink-50 min-h-screen p-3.5 font-sans">
  <div class="max-w-lg mx-auto space-y-3.5 pb-14">

    <!-- Header / Studio Status Bar -->
    <div class="anime-card rounded-2xl p-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-3 h-3 rounded-full bg-rose-500 animate-ping"></div>
        <div>
          <h1 class="text-sm font-black tracking-wider text-white glow-text">🌸 ANIME LOFT STUDIO</h1>
          <p id="mjStatusText" class="text-[10px] text-pink-300/80">System online — ready to deploy.</p>
        </div>
      </div>
      <div id="buildBadge" class="px-3 py-1 rounded-full text-[11px] font-bold bg-rose-500/20 border border-rose-500/40 text-rose-200">Idle</div>
    </div>

    <!-- 1. GitHub Token Connection -->
    <div class="anime-card rounded-2xl p-3.5 space-y-2">
      <div class="flex justify-between items-center">
        <span class="text-[10px] font-black uppercase tracking-widest text-pink-400">1. GitHub API Token</span>
        <button id="toggleTokenBtn" type="button" class="text-[11px] text-pink-300/60 underline">Show / Edit</button>
      </div>
      <div id="tokenWrap" class="flex gap-2">
        <input id="ghToken" type="password" placeholder="Paste github_pat_... token" class="flex-1 bg-black/60 border border-pink-500/30 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-rose-500">
        <button id="saveTokenBtn" type="button" class="px-4 py-2 bg-gradient-to-r from-rose-500 to-pink-500 text-white font-black rounded-xl text-xs shadow-lg shadow-rose-500/20">Connect</button>
      </div>
    </div>

    <!-- 2. Repo & File Selector -->
    <div class="anime-card rounded-2xl p-3.5 space-y-2.5">
      <div class="text-[10px] font-black uppercase tracking-widest text-rose-400">2. Select App Repo & File</div>
      <div class="grid grid-cols-2 gap-2">
        <select id="repoSelect" class="bg-black/60 border border-pink-500/30 rounded-xl px-2.5 py-2 text-xs text-white outline-none"></select>
        <select id="fileSelect" class="bg-black/60 border border-pink-500/30 rounded-xl px-2.5 py-2 text-xs text-white outline-none"></select>
      </div>
      <div class="flex gap-2">
        <input id="newFileName" type="text" placeholder="Or new filename (e.g. patch-fix.js)" class="flex-1 bg-black/60 border border-pink-500/30 rounded-xl px-3 py-1.5 text-xs text-white outline-none">
        <button id="createFileModeBtn" type="button" class="px-3.5 py-1.5 bg-rose-500/20 border border-rose-500/40 text-rose-200 font-bold rounded-xl text-xs">+ New</button>
      </div>
    </div>

    <!-- 3. Code Editor & Deploy Studio -->
    <div class="anime-card rounded-2xl p-3.5 space-y-2.5">
      <div class="flex items-center justify-between">
        <span id="activePathLabel" class="text-xs font-mono font-bold text-pink-300 truncate">No file loaded</span>
        <div class="flex gap-1.5 shrink-0">
          <button id="pasteReplaceBtn" type="button" class="px-2.5 py-1.5 bg-pink-500 text-slate-950 font-black rounded-xl text-[11px]">📋 Paste All</button>
          <button id="copyCurrentBtn" type="button" class="px-2.5 py-1.5 bg-black/50 border border-pink-500/30 text-pink-200 font-bold rounded-xl text-[11px]">Copy</button>
        </div>
      </div>
      <textarea id="codeEditor" rows="14" spellcheck="false" placeholder="Type or paste code here..." class="w-full bg-[#050208] border border-pink-500/25 rounded-xl p-3 text-[11px] text-pink-100 font-mono leading-relaxed outline-none focus:border-rose-500 shadow-inner"></textarea>
      <div class="flex gap-2">
        <input id="commitMsg" type="text" value="Anime Loft Studio update" class="flex-1 bg-black/60 border border-pink-500/30 rounded-xl px-3 py-2 text-xs text-white outline-none">
        <button id="deployBtn" type="button" class="px-5 py-2.5 bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 text-white font-black rounded-xl text-xs shrink-0 shadow-lg shadow-rose-500/30">🚀 Deploy Now</button>
      </div>
      <a id="liveSiteLink" href="#" target="_blank" class="hidden block text-center py-2 bg-black/60 border border-emerald-500/40 rounded-xl text-xs font-bold text-emerald-300">↗ Open Live App</a>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    const TOKEN_KEY = "app_forge_gh_token_v1";
    let ghUser = "", currentSha = null, isNewFile = false;
    const $ = id => document.getElementById(id);
    const getHeaders = () => ({ "Authorization": `Bearer ${localStorage.getItem(TOKEN_KEY) || ""}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" });

    function setStatus(text, tone = "idle") {
      const b = $("buildBadge"); b.textContent = text;
      $("mjStatusText").textContent = text;
      b.className = tone === "ok"
        ? "px-3 py-1 rounded-full text-[11px] font-bold bg-emerald-500/25 border border-emerald-400 text-emerald-200"
        : tone === "busy"
        ? "px-3 py-1 rounded-full text-[11px] font-bold bg-amber-500/25 border border-amber-400 text-amber-200"
        : "px-3 py-1 rounded-full text-[11px] font-bold bg-rose-500/20 border border-rose-500/40 text-rose-200";
    }

    async function initConnection() {
      const tok = localStorage.getItem(TOKEN_KEY); if (!tok) return;
      $("ghToken").value = tok; $("tokenWrap").classList.add("hidden"); setStatus("Connecting to GitHub...", "busy");
      const uRes = await fetch("https://api.github.com/user", { headers: getHeaders() });
      if (!uRes.ok) { setStatus("Token Error"); $("tokenWrap").classList.remove("hidden"); return; }
      const u = await uRes.json(); ghUser = u.login;
      const rRes = await fetch("https://api.github.com/user/repos?per_page=100&sort=updated", { headers: getHeaders() });
      const repos = await rRes.json();
      $("repoSelect").innerHTML = repos.map(r => `<option value="${r.name}">${r.name}</option>`).join("");
      if (repos.some(r => r.name === "Skill-Tree")) $("repoSelect").value = "Skill-Tree";
      setStatus(`Connected as ${ghUser}`, "ok"); await loadRepoFiles();
    }

    async function loadRepoFiles() {
      const repo = $("repoSelect").value; if (!repo || !ghUser) return;
      const link = $("liveSiteLink"); link.href = `https://${ghUser.toLowerCase()}.github.io/${repo}/`; link.textContent = `↗ Open Live ${repo}`; link.classList.remove("hidden");
      const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/contents/`, { headers: getHeaders() });
      const items = await res.json();
      const files = Array.isArray(items) ? items.filter(x => x.type === "file") : [];
      $("fileSelect").innerHTML = files.map(f => `<option value="${f.path}">${f.path}</option>`).join("");
      if (files.length) await loadFileContent(files[0].path);
    }

    async function loadFileContent(path) {
      const repo = $("repoSelect").value; isNewFile = false; $("activePathLabel").textContent = `${repo}/${path}`; setStatus("Loading file...", "busy");
      const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/contents/${path}`, { headers: getHeaders() });
      const data = await res.json(); currentSha = data.sha;
      const bytes = Uint8Array.from(atob(data.content.replace(/\n/g, "")), c => c.charCodeAt(0));
      $("codeEditor").value = new TextDecoder().decode(bytes); setStatus("Ready to code", "ok");
    }

    async function deployFile() {
      const repo = $("repoSelect").value, path = isNewFile ? $("newFileName").value.trim() : $("fileSelect").value;
      if (!repo || !path) return alert("Select or name a file first.");
      const encoded = btoa(String.fromCharCode(...new TextEncoder().encode($("codeEditor").value)));
      setStatus("Deploying to GitHub...", "busy");
      const body = { message: $("commitMsg").value.trim() || `Update ${path}`, content: encoded };
      if (!isNewFile && currentSha) body.sha = currentSha;
      const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/contents/${path}`, { method: "PUT", headers: getHeaders(), body: JSON.stringify(body) });
      if (!res.ok) { const err = await res.json(); setStatus("Deploy Failed"); return alert("GitHub API Error: " + (err.message || res.status)); }
      const out = await res.json(); currentSha = out.content.sha; isNewFile = false; $("activePathLabel").textContent = `${repo}/${path}`;
      setStatus("Building Pages...", "busy"); pollPagesStatus(repo);
    }

    async function pollPagesStatus(repo) {
      for (let i = 0; i < 18; i++) {
        await new Promise(r => setTimeout(r, 4000));
        try {
          const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/pages/builds/latest`, { headers: getHeaders() });
          if (res.ok) { const b = await res.json(); if (b.status === "built") { setStatus("🟢 Live on Pages!", "ok"); return; } if (b.status === "errored") { setStatus("🔴 Build Error"); return; } }
        } catch {}
      }
      setStatus("🟢 Pushed to Main", "ok");
    }

    $("saveTokenBtn").onclick = () => { const val = $("ghToken").value.trim(); if (!val) return; localStorage.setItem(TOKEN_KEY, val); initConnection(); };
    $("toggleTokenBtn").onclick = () => $("tokenWrap").classList.toggle("hidden");
    $("repoSelect").onchange = loadRepoFiles;
    $("fileSelect").onchange = () => loadFileContent($("fileSelect").value);
    $("createFileModeBtn").onclick = () => { const fn = $("newFileName").value.trim(); if (!fn) return alert("Type filename first"); isNewFile = true; currentSha = null; $("activePathLabel").textContent = `${$("repoSelect").value}/${fn} (NEW)`; $("codeEditor").value = ""; };
    $("pasteReplaceBtn").onclick = async () => { try { const clip = await navigator.clipboard.readText(); if (clip) $("codeEditor").value = clip; } catch {} };
    $("copyCurrentBtn").onclick = async () => { await navigator.clipboard.writeText($("codeEditor").value); setStatus("Copied to clipboard!", "ok"); };
    $("deployBtn").onclick = deployFile;
    initConnection();
  </script>
</body>
</html>
