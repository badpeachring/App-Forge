<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0714">
  <link rel="manifest" href="manifest.json">
  <title>App Forge • Fixed UI Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.5/lib/three-vrm.module.min.js"
      }
    }
  </script>
  <style>.glass-card { background: rgba(18, 11, 28, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(244, 63, 94, 0.25); }</style>
</head>
<body class="bg-[#0d0714] text-amber-50 min-h-screen p-3.5 font-sans">
  <div class="max-w-lg mx-auto space-y-3 pb-12">
    <div class="relative rounded-3xl overflow-hidden border border-rose-500/35 shadow-2xl bg-[#140b20]">
      <div class="absolute top-3 left-3 right-3 z-10 flex items-center justify-between">
        <div class="bg-black/65 px-3 py-1 rounded-full border border-rose-400/40 text-[10px] font-black uppercase text-rose-200">🌸 VRM Studio</div>
        <div id="buildBadge" class="px-3 py-1 rounded-full text-[11px] font-bold bg-black/65 border border-amber-400/35 text-amber-200">Idle</div>
      </div>
      <div id="stage3d" class="w-full h-64 relative"></div>
      <div class="grid grid-cols-4 gap-1.5 px-3 py-2 bg-black/80 border-t border-rose-500/20">
        <button id="cmdIdleBtn" type="button" class="py-1.5 rounded-lg bg-slate-800/90 border border-rose-500/30 text-[11px] font-bold text-rose-200">😌 Idle</button>
        <button id="cmdHackBtn" type="button" class="py-1.5 rounded-lg bg-slate-800/90 border border-sky-500/30 text-[11px] font-bold text-sky-200">💻 Hack</button>
        <button id="cmdWaveBtn" type="button" class="py-1.5 rounded-lg bg-slate-800/90 border border-amber-500/30 text-[11px] font-bold text-amber-200">👋 Wave</button>
        <button id="cmdCelebrateBtn" type="button" class="py-1.5 rounded-lg bg-slate-800/90 border border-emerald-500/30 text-[11px] font-bold text-emerald-200">🎉 Celebrate</button>
      </div>
      <div id="mjSpeech" class="px-4 py-2 bg-black/90 border-t border-rose-500/25 text-[11px] text-amber-200 flex items-center justify-between">
        <span>💬 "UI controls restored and locked in place!"</span>
        <span id="repoCounterPill" class="text-[10px] font-bold text-emerald-400"></span>
      </div>
    </div>

    <div class="glass-card rounded-2xl p-3.5 space-y-2">
      <div class="flex justify-between items-center"><span class="text-[10px] font-black uppercase text-amber-300">1. GitHub Token</span><button id="toggleTokenBtn" type="button" class="text-[11px] text-rose-300/70 underline">Show / Edit</button></div>
      <div id="tokenWrap" class="flex gap-2">
        <input id="ghToken" type="password" placeholder="Paste token" class="flex-1 bg-black/60 border border-rose-500/30 rounded-xl px-3 py-2 text-xs text-white outline-none">
        <button id="saveTokenBtn" type="button" class="px-4 py-2 bg-gradient-to-r from-rose-500 to-amber-500 text-slate-950 font-black rounded-xl text-xs">Connect</button>
      </div>
    </div>

    <div class="glass-card rounded-2xl p-3.5 space-y-2.5">
      <div class="text-[10px] font-black uppercase text-rose-300">2. Select App Repo & File</div>
      <div class="grid grid-cols-2 gap-2">
        <select id="repoSelect" class="bg-black/60 border border-rose-500/30 rounded-xl px-2.5 py-2 text-xs text-white outline-none"></select>
        <select id="fileSelect" class="bg-black/60 border border-rose-500/30 rounded-xl px-2.5 py-2 text-xs text-white outline-none"></select>
      </div>
      <div class="flex gap-2">
        <input id="newFileName" type="text" placeholder="Or new filename" class="flex-1 bg-black/60 border border-rose-500/30 rounded-xl px-3 py-1.5 text-xs text-white outline-none">
        <button id="createFileModeBtn" type="button" class="px-3.5 py-1.5 bg-rose-500/20 border border-rose-500/40 text-rose-200 font-bold rounded-xl text-xs">+ New</button>
      </div>
    </div>

    <div class="glass-card rounded-2xl p-3.5 space-y-2.5">
      <div class="flex items-center justify-between">
        <span id="activePathLabel" class="text-xs font-mono font-bold text-emerald-300 truncate">No file loaded</span>
        <div class="flex gap-1.5 shrink-0">
          <button id="pasteReplaceBtn" type="button" class="px-2.5 py-1.5 bg-amber-400 text-slate-950 font-black rounded-xl text-[11px]">📋 Paste All</button>
          <button id="copyCurrentBtn" type="button" class="px-2.5 py-1.5 bg-black/60 border border-rose-500/30 text-rose-200 font-bold rounded-xl text-[11px]">Copy</button>
        </div>
      </div>
      <textarea id="codeEditor" rows="12" spellcheck="false" placeholder="Type or paste code here..." class="w-full bg-[#07040b] border border-rose-500/25 rounded-xl p-3 text-[11px] text-amber-100 font-mono leading-relaxed outline-none"></textarea>
      <div class="flex gap-2">
        <input id="commitMsg" type="text" value="UI fix update" class="flex-1 bg-black/60 border border-rose-500/30 rounded-xl px-3 py-2 text-xs text-white outline-none">
        <button id="deployBtn" type="button" class="px-5 py-2.5 bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 text-white font-black rounded-xl text-xs shrink-0 shadow-lg">🚀 Deploy Now</button>
      </div>
      <a id="liveSiteLink" href="#" target="_blank" class="hidden block text-center py-2 bg-black/60 border border-emerald-500/40 rounded-xl text-xs font-bold text-emerald-300">↗ Open Live App</a>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    const TOKEN_KEY = "app_forge_gh_token_v1";
    let ghUser = "", currentSha = null, isNewFile = false, mjMode = "idle", currentVrm = null;
    const $ = id => document.getElementById(id);
    const getHeaders = () => ({ "Authorization": `Bearer ${localStorage.getItem(TOKEN_KEY) || ""}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" });

    const box = $("stage3d");
    const w = box.clientWidth || 400, h = box.clientHeight || 256;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x140b20);
    scene.fog = new THREE.FogExp2(0x140b20, 0.055);

    const cam = new THREE.PerspectiveCamera(34, w / h, 0.1, 50);
    cam.position.set(0.18, 1.30, 2.30);
    cam.lookAt(-0.10, 1.02, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    box.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffedd5, 0.8));
    const keyLight = new THREE.DirectionalLight(0xfff1f2, 1.35);
    keyLight.position.set(1.5, 2.5, 2.2);
    scene.add(keyLight);
    const crtLight = new THREE.PointLight(0x38bdf8, 1.8, 4);
    crtLight.position.set(-0.72, 1.12, 0.48);
    scene.add(crtLight);

    const loader = new GLTFLoader();
    loader.register(parser => new VRMLoaderPlugin(parser));

    loader.load("mj.vrm", gltf => {
      const vrm = gltf.userData.vrm;
      if (!vrm) return;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      VRMUtils.rotateVRM0(vrm);
      currentVrm = vrm;
      vrm.scene.position.set(0.08, -0.38, 0.15);
      vrm.scene.matrixAutoUpdate = false;
      vrm.scene.updateMatrix();
      scene.add(vrm.scene);
    }, undefined, err => console.error("MJ VRM load error:", err));

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const t = clock.elapsedTime;
      if (currentVrm) {
        const h = currentVrm.humanoid, exp = currentVrm.expressionManager;
        if (exp) {
          const blinkCycle = t % 3.6;
          exp.setValue("blink", blinkCycle > 3.45 ? Math.sin(((blinkCycle - 3.45) / 0.15) * Math.PI) : 0);
          exp.setValue("happy", mjMode === "celebrate" ? 0.95 : 0.3);
        }
        const lUpLeg = h.getNormalizedBoneNode("leftUpperLeg"), rUpLeg = h.getNormalizedBoneNode("rightUpperLeg");
        const lLoLeg = h.getNormalizedBoneNode("leftLowerLeg"), rLoLeg = h.getNormalizedBoneNode("rightLowerLeg");
        if (lUpLeg && rUpLeg) { lUpLeg.rotation.x = 1.35; rUpLeg.rotation.x = 1.35; }
        if (lLoLeg && rLoLeg) { lLoLeg.rotation.x = -1.35; rLoLeg.rotation.x = -1.35; }

        const spine = h.getNormalizedBoneNode("spine"), head = h.getNormalizedBoneNode("head");
        const lArm = h.getNormalizedBoneNode("leftUpperArm"), rArm = h.getNormalizedBoneNode("rightUpperArm");
        const lFore = h.getNormalizedBoneNode("leftLowerArm"), rFore = h.getNormalizedBoneNode("rightLowerArm");

        if (mjMode === "hack") {
          currentVrm.scene.rotation.y = THREE.MathUtils.lerp(currentVrm.scene.rotation.y, -0.78, 0.12);
          if (spine) spine.rotation.x = 0.14 + Math.sin(t * 14) * 0.015;
          if (head) head.rotation.y = -0.15;
          if (lArm && rArm) { lArm.rotation.set(0.62, 0, 0.42); rArm.rotation.set(0.62, 0, -0.42); }
          if (lFore && rFore) { lFore.rotation.set(0.85 + Math.sin(t * 28) * 0.14, 0, 0.25); rFore.rotation.set(0.85 + Math.cos(t * 28) * 0.14, 0, -0.25); }
        } else if (mjMode === "celebrate") {
          currentVrm.scene.rotation.y = THREE.MathUtils.lerp(currentVrm.scene.rotation.y, 0.18, 0.12);
          if (spine) spine.rotation.z = Math.sin(t * 8) * 0.06;
          if (lArm && rArm) { lArm.rotation.set(0.25, 0, -0.95); rArm.rotation.set(0.25, 0, 0.95); }
        } else if (mjMode === "wave") {
          currentVrm.scene.rotation.y = THREE.MathUtils.lerp(currentVrm.scene.rotation.y, 0.22, 0.12);
          if (lArm && rArm) { lArm.rotation.set(0.18, 0, 1.15); rArm.rotation.set(0.22, 0, 0.85 + Math.sin(t * 9) * 0.25); }
        } else {
          currentVrm.scene.rotation.y = THREE.MathUtils.lerp(currentVrm.scene.rotation.y, 0.22, 0.08);
          if (lArm && rArm) { lArm.rotation.set(0.22, 0, 1.12); rArm.rotation.set(0.22, 0, -1.12); }
          if (lFore && rFore) { lFore.rotation.set(0.38, 0, 0.18); rFore.rotation.set(0.38, 0, -0.18); }
        }
        currentVrm.scene.updateMatrix();
        currentVrm.update(dt);
      }
      renderer.render(scene, cam);
    }
    animate();

    function setMjState(mode, text) { mjMode = mode; if (text) $("mjSpeech").firstElementChild.textContent = `💬 "${text}"`; }
    $("cmdIdleBtn").onclick = () => setMjState("idle", "Locked in place and ready.");
    $("cmdHackBtn").onclick = () => setMjState("hack", "Terminal engaged!");
    $("cmdWaveBtn").onclick = () => setMjState("wave", "Hey there!");
    $("cmdCelebrateBtn").onclick = () => setMjState("celebrate", "Build live!");

    async function initConnection() {
      const tok = localStorage.getItem(TOKEN_KEY); if (!tok) return;
      $("ghToken").value = tok; $("tokenWrap").classList.add("hidden");
      const uRes = await fetch("https://api.github.com/user", { headers: getHeaders() });
      if (!uRes.ok) { $("tokenWrap").classList.remove("hidden"); return; }
      const u = await uRes.json(); ghUser = u.login;
      const rRes = await fetch("https://api.github.com/user/repos?per_page=100", { headers: getHeaders() });
      const repos = await rRes.json();
      $("repoSelect").innerHTML = repos.map(r => `<option value="${r.name}">${r.name}</option>`).join("");
      if (repos.some(r => r.name === "Skill-Tree")) $("repoSelect").value = "Skill-Tree";
      await loadRepoFiles();
    }
    async function loadRepoFiles() {
      const repo = $("repoSelect").value; if (!repo || !ghUser) return;
      const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/contents/`, { headers: getHeaders() });
      const items = await res.json();
      const files = Array.isArray(items) ? items.filter(x => x.type === "file") : [];
      $("fileSelect").innerHTML = files.map(f => `<option value="${f.path}">${f.path}</option>`).join("");
      if (files.length) await loadFileContent(files[0].path);
    }
    async function loadFileContent(path) {
      const repo = $("repoSelect").value; isNewFile = false; $("activePathLabel").textContent = `${repo}/${path}`;
      const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/contents/${path}`, { headers: getHeaders() });
      const data = await res.json(); currentSha = data.sha;
      $("codeEditor").value = new TextDecoder().decode(Uint8Array.from(atob(data.content.replace(/\n/g, "")), c => c.charCodeAt(0)));
    }
    async function deployFile() {
      const repo = $("repoSelect").value, path = isNewFile ? $("newFileName").value.trim() : $("fileSelect").value;
      if (!repo || !path) return alert("Select file first.");
      const encoded = btoa(String.fromCharCode(...new TextEncoder().encode($("codeEditor").value)));
      setMjState("hack", `Deploying ${path}...`);
      const body = { message: `Update ${path}`, content: encoded };
      if (!isNewFile && currentSha) body.sha = currentSha;
      const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/contents/${path}`, { method: "PUT", headers: getHeaders(), body: JSON.stringify(body) });
      if (!res.ok) { setMjState("idle", "Deploy failed."); return alert("API Error"); }
      const out = await res.json(); currentSha = out.content.sha; isNewFile = false;
      setMjState("celebrate", "Live on Pages!");
    }
    $("saveTokenBtn").onclick = () => { localStorage.setItem(TOKEN_KEY, $("ghToken").value.trim()); initConnection(); };
    $("repoSelect").onchange = loadRepoFiles;
    $("fileSelect").onchange = () => loadFileContent($("fileSelect").value);
    $("deployBtn").onclick = deployFile;
    if (localStorage.getItem(TOKEN_KEY)) initConnection();
  </script>
</body>
</html>
